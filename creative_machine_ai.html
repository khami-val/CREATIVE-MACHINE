<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Creative Machine</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0d0d0d;
  --surface: #161616;
  --surface2: #1e1e1e;
  --surface3: #252525;
  --border: rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.12);
  --accent: #E8FF47;
  --accent-dim: rgba(232,255,71,0.1);
  --text: #f0f0f0;
  --muted: #777;
  --muted2: #555;
  --tag-content-bg: rgba(29,158,117,0.15);
  --tag-content: #5dcaa5;
  --tag-tech-bg: rgba(55,138,221,0.15);
  --tag-tech: #85b7eb;
  --tag-teach-bg: rgba(127,119,221,0.15);
  --tag-teach: #afa9ec;
  --tag-money-bg: rgba(239,159,39,0.15);
  --tag-money: #fac775;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; }
body { font-family: 'Manrope', sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; }

/* ── HEADER ── */
.app-header {
  flex-shrink: 0;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  padding: 12px 16px 10px;
}
.header-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.brand { font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 0.06em; color: var(--accent); }
.progress-wrap { display: flex; align-items: center; gap: 8px; }
.progress-track { width: 72px; height: 4px; background: var(--surface2); border-radius: 2px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.4s; }
.progress-text { font-size: 12px; color: var(--muted); font-weight: 600; }
.week-tabs { display: flex; gap: 5px; overflow-x: auto; scrollbar-width: none; }
.week-tabs::-webkit-scrollbar { display: none; }
.tab { flex-shrink: 0; padding: 5px 12px; font-size: 12px; font-weight: 600; border-radius: 20px; border: 1px solid var(--border); background: transparent; color: var(--muted); cursor: pointer; transition: all 0.15s; font-family: 'Manrope', sans-serif; }
.tab.active { background: var(--accent); color: #0d0d0d; border-color: var(--accent); }

/* ── VIEWS ── */
.views { flex: 1; overflow: hidden; position: relative; }
.view { position: absolute; inset: 0; overflow-y: auto; transition: opacity 0.2s, transform 0.2s; }
.view.hidden { opacity: 0; pointer-events: none; transform: translateX(20px); }

/* ── TASKS VIEW ── */
.tasks-content { padding: 14px 16px 100px; }
.phase-name { font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
.week-stat { margin-bottom: 12px; }
.stat-pill { display: inline-flex; font-size: 12px; color: var(--muted); background: var(--surface2); padding: 4px 10px; border-radius: 20px; }
.stat-pill b { color: var(--text); font-weight: 600; margin-left: 3px; }
.task-list { display: flex; flex-direction: column; gap: 5px; }
.task-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 11px 13px; display: flex; align-items: flex-start; gap: 11px; cursor: pointer; transition: background 0.12s, transform 0.08s; user-select: none; -webkit-user-select: none; }
.task-card:active { transform: scale(0.98); background: var(--surface2); }
.task-card.done { opacity: 0.45; }
.checkbox { width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid rgba(255,255,255,0.18); flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: all 0.15s; margin-top: 1px; }
.task-card.done .checkbox { background: var(--accent); border-color: var(--accent); }
.check-svg { display: none; }
.task-card.done .check-svg { display: block; }
.task-body { flex: 1; min-width: 0; }
.task-day { font-size: 11px; color: var(--muted); margin-bottom: 2px; font-weight: 600; }
.task-text { font-size: 14px; line-height: 1.45; color: var(--text); }
.task-card.done .task-text { text-decoration: line-through; color: var(--muted); }
.tag { font-size: 10px; font-weight: 700; padding: 3px 7px; border-radius: 6px; flex-shrink: 0; letter-spacing: 0.04em; text-transform: uppercase; margin-top: 2px; }
.tag-content { background: var(--tag-content-bg); color: var(--tag-content); }
.tag-tech    { background: var(--tag-tech-bg);    color: var(--tag-tech);    }
.tag-teach   { background: var(--tag-teach-bg);   color: var(--tag-teach);   }
.tag-money   { background: var(--tag-money-bg);   color: var(--tag-money);   }

/* ── AI VIEW ── */
.ai-content { display: flex; flex-direction: column; height: 100%; }
.ai-context-bar {
  flex-shrink: 0;
  padding: 10px 16px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  font-size: 12px;
  color: var(--muted);
  display: flex;
  align-items: center;
  gap: 6px;
}
.ai-context-bar span { color: var(--accent); font-weight: 600; }
.chat-messages {
  flex: 1;
  overflow-y: auto;
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.msg { max-width: 88%; display: flex; flex-direction: column; gap: 3px; }
.msg.user { align-self: flex-end; align-items: flex-end; }
.msg.ai   { align-self: flex-start; align-items: flex-start; }
.msg-bubble {
  padding: 10px 13px;
  border-radius: 14px;
  font-size: 14px;
  line-height: 1.5;
  white-space: pre-wrap;
  word-break: break-word;
}
.msg.user .msg-bubble { background: var(--accent); color: #0d0d0d; border-bottom-right-radius: 4px; font-weight: 500; }
.msg.ai   .msg-bubble { background: var(--surface2); color: var(--text); border-bottom-left-radius: 4px; border: 1px solid var(--border); }
.msg-time { font-size: 10px; color: var(--muted2); padding: 0 4px; }

.typing-bubble { background: var(--surface2); border: 1px solid var(--border); border-radius: 14px; border-bottom-left-radius: 4px; padding: 12px 16px; display: flex; gap: 5px; align-items: center; }
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: bounce 1.2s infinite; }
.dot:nth-child(2) { animation-delay: 0.2s; }
.dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes bounce { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-5px)} }

/* applied changes banner */
.changes-banner {
  margin: 0 16px;
  padding: 10px 13px;
  background: rgba(232,255,71,0.08);
  border: 1px solid rgba(232,255,71,0.2);
  border-radius: 10px;
  font-size: 13px;
  color: var(--accent);
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
}
.changes-banner:active { opacity: 0.7; }

/* ── INPUT BAR ── */
.input-bar {
  flex-shrink: 0;
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg);
  border-top: 1px solid var(--border);
  padding: 10px 12px;
  padding-bottom: max(10px, env(safe-area-inset-bottom));
  display: flex;
  gap: 8px;
  align-items: flex-end;
  z-index: 20;
}
.input-wrap { flex: 1; background: var(--surface); border: 1px solid var(--border2); border-radius: 20px; padding: 9px 14px; display: flex; align-items: center; }
#chatInput {
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  color: var(--text);
  font-family: 'Manrope', sans-serif;
  font-size: 14px;
  resize: none;
  max-height: 100px;
  line-height: 1.4;
  overflow-y: auto;
}
#chatInput::placeholder { color: var(--muted); }
.send-btn {
  width: 38px; height: 38px;
  border-radius: 50%;
  background: var(--accent);
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: transform 0.1s, opacity 0.1s;
}
.send-btn:active { transform: scale(0.92); }
.send-btn:disabled { opacity: 0.4; cursor: default; }

/* ── BOTTOM NAV ── */
.bottom-nav {
  position: fixed;
  bottom: 60px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 6px;
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 24px;
  padding: 5px;
  z-index: 25;
}
.nav-btn {
  padding: 7px 16px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 700;
  font-family: 'Manrope', sans-serif;
  border: none;
  cursor: pointer;
  transition: all 0.15s;
  letter-spacing: 0.02em;
}
.nav-btn.active { background: var(--accent); color: #0d0d0d; }
.nav-btn:not(.active) { background: transparent; color: var(--muted); }

/* ── TOAST ── */
.toast {
  position: fixed;
  bottom: 110px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--surface2);
  color: var(--text);
  font-size: 13px;
  font-weight: 500;
  padding: 9px 18px;
  border-radius: 20px;
  border: 1px solid var(--border2);
  transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1), opacity 0.3s;
  z-index: 100;
  white-space: nowrap;
  pointer-events: none;
  opacity: 0;
}
.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

/* suggestions */
.suggestions {
  flex-shrink: 0;
  display: flex;
  gap: 6px;
  overflow-x: auto;
  scrollbar-width: none;
  padding: 8px 16px 4px;
}
.suggestions::-webkit-scrollbar { display: none; }
.suggestion-chip {
  flex-shrink: 0;
  padding: 6px 12px;
  border-radius: 16px;
  font-size: 12px;
  font-weight: 600;
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--muted);
  cursor: pointer;
  transition: all 0.12s;
  font-family: 'Manrope', sans-serif;
}
.suggestion-chip:active { background: var(--surface3); color: var(--text); }
</style>
</head>
<body>

<div class="app-header">
  <div class="header-row">
    <div class="brand">Creative Machine</div>
    <div class="progress-wrap">
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-text" id="progressText">0/28</div>
    </div>
  </div>
  <div class="week-tabs" id="weekTabs"></div>
</div>

<div class="views">
  <!-- TASKS VIEW -->
  <div class="view" id="viewTasks">
    <div class="tasks-content" id="tasksContent"></div>
  </div>

  <!-- AI VIEW -->
  <div class="view hidden" id="viewAI">
    <div class="ai-content">
      <div class="ai-context-bar">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="6" stroke="#E8FF47" stroke-width="1.2"/><path d="M7 4v3.5l2 1.5" stroke="#E8FF47" stroke-width="1.2" stroke-linecap="round"/></svg>
        Редактирую план: <span id="aiContextLabel">весь план</span>
      </div>
      <div class="chat-messages" id="chatMessages"></div>
      <div class="suggestions" id="suggestions"></div>
    </div>
  </div>
</div>

<!-- BOTTOM NAV -->
<div class="bottom-nav">
  <button class="nav-btn active" id="navTasks" onclick="switchView('tasks')">Задачи</button>
  <button class="nav-btn" id="navAI" onclick="switchView('ai')">AI Редактор</button>
</div>

<!-- INPUT BAR (only in AI view) -->
<div class="input-bar" id="inputBar" style="display:none">
  <div class="input-wrap">
    <textarea id="chatInput" rows="1" placeholder="Измени план или добавь задачи..."></textarea>
  </div>
  <button class="send-btn" id="sendBtn" onclick="sendMessage()">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 8L14 2L10 8L14 14L2 8Z" fill="#0d0d0d"/></svg>
  </button>
</div>

<div class="toast" id="toast"></div>

<script>
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

// ── DATA ──
const DEFAULT_WEEKS = [
  {
    label: "Неделя 1", phase: "Контентная интервенция",
    tasks: [
      { day: "День 1", text: "Записать и выложить «Манифест» в Reels/ТГ", tag: "content" },
      { day: "День 2", text: "Туториал по CSV-автоматизации — выложить везде", tag: "tech" },
      { day: "День 3", text: "Аналитический разбор 3 креативов в ТГ", tag: "content" },
      { day: "День 4", text: "Провокационный пост «Дизайн ради дизайна — мусор»", tag: "content" },
      { day: "День 5", text: "Анонс бесплатного курса + анкета предзаписи", tag: "content" },
      { day: "День 6", text: "Пост об Escrow и рисках в крипте", tag: "tech" },
      { day: "День 7", text: "Стрим: «Как войти в нишу с нуля»", tag: "content" },
    ]
  },
  {
    label: "Неделя 2", phase: "Технический авторитет",
    tasks: [
      { day: "День 8",  text: "Разбор рабочего сетапа и Master-Project в AE", tag: "tech" },
      { day: "День 9",  text: "Пост о психологии триггеров: звук монетки vs 4K", tag: "content" },
      { day: "День 10", text: "Видео «AI 2026»: обход фильтров Facebook", tag: "tech" },
      { day: "День 11", text: "Прямой эфир с разбором портфолио подписчиков", tag: "content" },
      { day: "День 12", text: "Интервью от байера: «Что нужно рынку?»", tag: "content" },
      { day: "День 13", text: "Сравнение доходов: Фриланс vs iGaming + ROI", tag: "money" },
      { day: "День 14", text: "Закрытие окна записи — создание дефицита", tag: "content" },
    ]
  },
  {
    label: "Неделя 3", phase: "Выполнение обещаний",
    tasks: [
      { day: "День 15", text: "Урок 1: Психология и триггеры", tag: "teach" },
      { day: "День 16", text: "Урок 2: Технический стек и первый крео", tag: "teach" },
      { day: "День 17", text: "Урок 3: Автоматизация 1 к 100 + шаблоны", tag: "teach" },
      { day: "День 18", text: "Урок 4: AI-ускорители — генерация ассетов", tag: "teach" },
      { day: "День 19", text: "Урок 5: Обход модерации и уникализация", tag: "teach" },
      { day: "День 20", text: "Урок 6: Финансы и безопасность (Escrow)", tag: "teach" },
      { day: "День 21", text: "Урок 7: Финальный босс — сборка портфолио", tag: "teach" },
    ]
  },
  {
    label: "Неделя 4", phase: "Grand Slam Pitch",
    tasks: [
      { day: "День 22", text: "Публикация работ учеников + теги баинговых чатов", tag: "money" },
      { day: "День 23", text: "Презентация Advanced Курса и хаба", tag: "money" },
      { day: "День 24", text: "Открытие продаж + рост цены каждые 24 часа", tag: "money" },
      { day: "День 25", text: "Видео «Внутрянка Advanced»: ComfyUI и AI-пайплайны", tag: "tech" },
      { day: "День 26", text: "Пост с дефицитом: «Осталось 5 мест»", tag: "money" },
      { day: "День 27", text: "Обработка возражений по методу Хормози", tag: "content" },
      { day: "День 28", text: "Закрытие продаж. Анонс «Закрытого Цеха»", tag: "money" },
    ]
  }
];

const TAG_LABELS = { content: "Контент", tech: "Техника", teach: "Обучение", money: "Деньги" };
const STORAGE_KEY = 'cm_ai_v2';

let state = {};
let weeks = [];
let currentWeek = 0;
let currentView = 'tasks';
let chatHistory = [];
let isLoading = false;

const SUGGESTIONS = [
  "Добавь задачу про TikTok в неделю 1",
  "Сделай неделю 2 более агрессивной",
  "Добавь 5-ю неделю для масштабирования",
  "Переименуй фазу Grand Slam Pitch",
  "Убери урок 6 из недели 3",
  "Покажи сводку прогресса",
];

function loadState() {
  try {
    const raw = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    state = raw.done || {};
    weeks = raw.weeks ? raw.weeks : JSON.parse(JSON.stringify(DEFAULT_WEEKS));
    chatHistory = raw.chat || [];
  } catch(e) {
    state = {}; weeks = JSON.parse(JSON.stringify(DEFAULT_WEEKS)); chatHistory = [];
  }
}

function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ done: state, weeks, chat: chatHistory.slice(-40) })); } catch(e) {}
}

function tid(w, t) { return `${w}_${t}`; }
function totalDone() {
  let n = 0;
  weeks.forEach((w, wi) => w.tasks.forEach((_, ti) => { if (state[tid(wi, ti)]) n++; }));
  return n;
}
function totalTasks() { return weeks.reduce((s,w) => s + w.tasks.length, 0); }

function updateProgress() {
  const done = totalDone(), total = totalTasks();
  const pct = total ? Math.round((done/total)*100) : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = done + '/' + total;
}

function renderTabs() {
  document.getElementById('weekTabs').innerHTML = weeks.map((w,i) =>
    `<button class="tab${i===currentWeek?' active':''}" onclick="switchWeek(${i})">${w.label}</button>`
  ).join('');
}

function renderTasks() {
  const week = weeks[currentWeek];
  const done = week.tasks.filter((_,ti) => state[tid(currentWeek,ti)]).length;
  let html = `<div class="phase-name">${week.phase}</div>`;
  html += `<div class="week-stat"><div class="stat-pill">Готово:<b>${done}</b> из ${week.tasks.length}</div></div>`;
  html += `<div class="task-list">`;
  week.tasks.forEach((task, ti) => {
    const isDone = !!state[tid(currentWeek,ti)];
    html += `<div class="task-card${isDone?' done':''}" onclick="toggle(${currentWeek},${ti})">
      <div class="checkbox"><svg class="check-svg" width="12" height="12" viewBox="0 0 12 12" fill="none"><polyline points="2,6 5,9 10,3" stroke="#0d0d0d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div class="task-body"><div class="task-day">${task.day}</div><div class="task-text">${task.text}</div></div>
      <div class="tag tag-${task.tag}">${TAG_LABELS[task.tag]||task.tag}</div>
    </div>`;
  });
  html += '</div>';
  document.getElementById('tasksContent').innerHTML = html;
}

function switchWeek(idx) {
  currentWeek = idx; renderTabs(); renderTasks();
}

function toggle(wi, ti) {
  const id = tid(wi, ti);
  state[id] = !state[id];
  saveState();
  if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
  renderTasks(); updateProgress();
  if (state[id]) showToast('✓ Выполнено');
}

// ── VIEWS ──
function switchView(v) {
  currentView = v;
  document.getElementById('viewTasks').classList.toggle('hidden', v !== 'tasks');
  document.getElementById('viewAI').classList.toggle('hidden', v !== 'ai');
  document.getElementById('navTasks').classList.toggle('active', v === 'tasks');
  document.getElementById('navAI').classList.toggle('active', v === 'ai');
  document.getElementById('inputBar').style.display = v === 'ai' ? 'flex' : 'none';
  if (v === 'ai') {
    renderChatHistory();
    renderSuggestions();
    setTimeout(() => scrollChatBottom(), 100);
  }
}

// ── CHAT ──
function renderChatHistory() {
  const el = document.getElementById('chatMessages');
  if (chatHistory.length === 0) {
    el.innerHTML = `<div class="msg ai"><div class="msg-bubble">Привет! Я помогу тебе редактировать план.\n\nМогу:\n• Добавить / удалить задачи\n• Изменить фазы и названия недель\n• Добавить новые недели\n• Перегенерировать любую часть плана\n\nПросто скажи что нужно изменить.</div></div>`;
    return;
  }
  el.innerHTML = chatHistory.map(m => `
    <div class="msg ${m.role}">
      <div class="msg-bubble">${escHtml(m.content)}</div>
      <div class="msg-time">${m.time||''}</div>
    </div>`).join('');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function addMsg(role, content) {
  const now = new Date();
  const time = now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');
  chatHistory.push({ role, content, time });
  const el = document.getElementById('chatMessages');
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.innerHTML = `<div class="msg-bubble">${escHtml(content)}</div><div class="msg-time">${time}</div>`;
  el.appendChild(div);
  scrollChatBottom();
}

function showTyping() {
  const el = document.getElementById('chatMessages');
  const div = document.createElement('div');
  div.className = 'msg ai'; div.id = 'typingIndicator';
  div.innerHTML = `<div class="typing-bubble"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>`;
  el.appendChild(div);
  scrollChatBottom();
}

function hideTyping() {
  document.getElementById('typingIndicator')?.remove();
}

function scrollChatBottom() {
  const el = document.getElementById('chatMessages');
  el.scrollTop = el.scrollHeight;
}

function renderSuggestions() {
  document.getElementById('suggestions').innerHTML = SUGGESTIONS.map(s =>
    `<div class="suggestion-chip" onclick="useSuggestion('${s}')">${s}</div>`
  ).join('');
}

function useSuggestion(text) {
  document.getElementById('chatInput').value = text;
  sendMessage();
}

async function sendMessage() {
  if (isLoading) return;
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text) return;
  input.value = ''; adjustTextarea(input);

  addMsg('user', text);
  document.getElementById('sendBtn').disabled = true;
  isLoading = true;
  showTyping();

  const planJson = JSON.stringify(weeks, null, 2);
  const systemPrompt = `Ты — AI-ассистент для редактирования таск-трекера «Creative Machine» (iGaming affiliate marketing roadmap).

ТЕКУЩИЙ ПЛАН (JSON):
${planJson}

Ты можешь:
1. Изменять текст задач, дни, теги
2. Добавлять/удалять задачи в любой неделе
3. Изменять названия недель и фаз
4. Добавлять новые недели
5. Перегенерировать части плана

Теги задач: content, tech, teach, money

ВАЖНО: Если пользователь просит изменить план — верни ВЕСЬ обновлённый массив недель в формате JSON в теге <PLAN>...</PLAN>, и объясни что изменил.

Если пользователь просто спрашивает (не просит менять) — отвечай текстом, без <PLAN>.

Отвечай коротко, по-русски.`;

  try {
    const messages = [
      ...chatHistory.slice(-10).filter(m => m.role !== 'system').map(m => ({
        role: m.role === 'ai' ? 'assistant' : 'user',
        content: m.content
      })),
      { role: 'user', content: text }
    ];

    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        system: systemPrompt,
        messages
      })
    });

    const data = await resp.json();
    const raw = data.content?.find(b => b.type === 'text')?.text || 'Не удалось получить ответ.';

    hideTyping();

    // Check for plan update
    const planMatch = raw.match(/<PLAN>([\s\S]*?)<\/PLAN>/);
    let aiText = raw.replace(/<PLAN>[\s\S]*?<\/PLAN>/g, '').trim();

    if (planMatch) {
      try {
        const newWeeks = JSON.parse(planMatch[1].trim());
        weeks = newWeeks;
        saveState();
        renderTabs(); renderTasks(); updateProgress();

        addMsg('ai', aiText || 'План обновлён!');
        showChangeBanner();
      } catch(e) {
        addMsg('ai', aiText || raw);
      }
    } else {
      addMsg('ai', aiText || raw);
    }

  } catch(e) {
    hideTyping();
    addMsg('ai', 'Ошибка соединения. Проверь интернет и попробуй снова.');
  }

  isLoading = false;
  document.getElementById('sendBtn').disabled = false;
  saveState();
}

function showChangeBanner() {
  const existing = document.getElementById('changeBanner');
  if (existing) existing.remove();
  const banner = document.createElement('div');
  banner.className = 'changes-banner'; banner.id = 'changeBanner';
  banner.innerHTML = `<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><polyline points="2,7 5.5,10.5 12,3.5" stroke="#E8FF47" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg> План обновлён — нажми чтобы посмотреть`;
  banner.onclick = () => { switchView('tasks'); banner.remove(); };
  document.getElementById('chatMessages').appendChild(banner);
  scrollChatBottom();
  if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
}

// auto-resize textarea
function adjustTextarea(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 100) + 'px';
}

document.getElementById('chatInput').addEventListener('input', function() { adjustTextarea(this); });
document.getElementById('chatInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});

// ── TOAST ──
let toastTimer;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2000);
}

// ── INIT ──
loadState();
renderTabs(); renderTasks(); updateProgress();
</script>
</body>
</html>
